name: Stock Screener Bot

on:
  schedule:
    # Jam 09:00 WIB (02:00 UTC) - Sesi Awal Pembukaan Bursa (Senin - Jumat)
    - cron: '0 2 * * 1-5'
  workflow_dispatch: # Tombol 'Run workflow' manual tetap aktif kapan saja

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance python-telegram-bot

      - name: Run Screener Script
        run: python main.py
