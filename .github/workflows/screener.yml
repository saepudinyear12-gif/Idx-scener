name: Otomatisasi Penyaring Saham

on:
  workflow_dispatch:  # Tetap ada agar Anda tetap bisa tes manual kapan saja
  schedule:
    - cron: '0 9 * * 1-5'  # Berjalan otomatis Senin - Jumat pukul 09:00 UTC (16:00 WIB)

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Run screener script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scener.yml  # Sesuaikan jika nama file python Anda scener.py
          
