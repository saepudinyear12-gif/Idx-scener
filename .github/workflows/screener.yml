name: Stock Screener Bot

on:
  schedule:
    # Berjalan otomatis Senin - Jumat pukul 16:05 WIB (09:05 UTC)
    - cron: '5 9 * * 1-5'
  workflow_dispatch: # Tombol untuk menjalankan manual kapan saja di web GitHub

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance python-telegram-bot

      - name: Run screener script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
        
